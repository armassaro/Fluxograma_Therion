# Therion Fluxo — pilha de produção (VPS própria).
#   docker compose up -d                      postgres + n8n
#   docker compose --profile tunel up -d      + Cloudflare Tunnel (expõe só /webhook/*)
# Nenhuma porta fica pública: o Postgres escuta em 127.0.0.1 e o editor do n8n em N8N_BIND
# (IP do Tailscale). Passo a passo completo em docs/runbook.md.
name: therion-fluxo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ej_fluxo}
      POSTGRES_USER: ${POSTGRES_USER:-ej}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro,z
    ports:
      - "127.0.0.1:${POSTGRES_PORTA_HOST:-5432}:5432"   # só para os scripts (migrar/fluxos) rodarem do host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ej} -d ${POSTGRES_DB:-ej_fluxo}"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    image: n8nio/n8n:2.47.7        # versão em que os workflows foram testados; atualize com cuidado
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kroki:
        condition: service_started
    env_file: .env                 # flags e segredos lidos pelos workflows via $env
    environment:
      # dados internos do n8n no mesmo Postgres, banco "n8n"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-ej}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      WEBHOOK_URL: ${BASE_URL_PUBLICA:-http://localhost:5678}/
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      # Os nós leem flags e tokens de $env. Consequência: quem edita workflows enxerga todas as
      # variáveis deste container. Dê acesso ao editor apenas a administradores (via Tailscale).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto   # lib/seguranca.js (comparação em tempo constante, HMAC)
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"   # horas (14 dias): execuções guardam conteúdo das mensagens
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro,z
    ports:
      - "${N8N_BIND:-127.0.0.1}:5678:5678"

  # Renderizador de diagramas (fluxograma do projeto: DOT -> PNG). Só na rede interna do Compose;
  # nenhum dado de projeto sai da máquina. O n8n chama http://kroki:8000 (KROKI_URL).
  kroki:
    image: yuzutech/kroki:0.28.0
    restart: unless-stopped
    environment:
      KROKI_SAFE_MODE: secure
      KROKI_MAX_URI_LENGTH: "8192"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [n8n]

  # Túnel temporário (sem conta/domínio) para rodar o bot no próprio computador: gera uma URL
  # https://*.trycloudflare.com que muda a cada reinício. Usado por scripts/ligar_local.sh.
  tunel_local:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    profiles: ["local"]
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on: [n8n]

volumes:
  pgdata:
  n8n_data:
